version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /gui
    schedule:
      interval: weekly
    groups:
      dashboard:
        patterns: ["*"]
    ignore:
      # typescript-eslint doesn't support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
