name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install packages from the lockfile
        run: uv sync --locked

      - name: Build the Rust parser
        run: uv run --no-sync maturin develop --uv --release -m parsers/rlreplay_rust/Cargo.toml

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Check formatting
        run: uv run --no-sync black --check src tests

      - name: Test
        run: uv run --no-sync pytest -q
        env:
          PYTHONPATH: src

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      # cargo test links libpython, which setup-python provides
      - uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test -p rlreplay_rust

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install packages from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
