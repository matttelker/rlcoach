[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlcoach"
version = "0.1.0"
description = "Local Rocket League replay coach with a browser dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "jsonschema",
    "pydantic",
    "sqlalchemy",
    "tzdata; sys_platform == 'win32'",
    "uvicorn[standard]",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
rlcoach = "rlcoach.cli:main"

[dependency-groups]
dev = [
    "black",
    "httpx2",
    "maturin",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
markers = ["slow: slower or optional tests"]
filterwarnings = [
    "error::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 88
target-version = ["py314"]
